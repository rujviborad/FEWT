<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

            // 0 1 1 2 3 5 8 13
            
            let a=0,b=1,c,i;

            let n=parseInt(prompt("Enter a number :"));

            for(i=1;i<=n;i++){

                document.write(a +"<br/>");
                
                c=a+b;
                a=b;
                b=c;
            }
    </script>
</body>
</html>
