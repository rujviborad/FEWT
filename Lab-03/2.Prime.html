<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <script>

             let num=parseInt(prompt("Enter a number :"));
             let i,count=0;

             for(let i=1;i<=num;i++){

                 if(num%i==0){

                       count++;
                 }
             }

             if(count==2){

                  alert("Prime Number ");
             }
             else {

                 alert("Not Prime Number ");
             }
      </script>
</body>
</html>
