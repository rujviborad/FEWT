<body>
       <script>
    
            let i,rem,sum=0,temp;

            let n=parseInt(prompt("Enter a number : "));

            temp=n;

            while(n>0){

                 rem=n%10;
                 sum = sum +(rem*rem*rem);
                 n=parseInt(n/10);
            }
            if (sum==temp){

                 alert(temp +" " +"is a armstrong number ");
            }
            else{

                alert(temp +" " +"is not a armstrong number ");
            }

       </script>
</body>
