<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default Parameter</title>
</head>
<body>
      

        <script>

            function sum(a,b,c=1){

                add=a+b+c;

                 document.write("answer is :"+add);

            }     
            
            sum(4,2);  // if i write (4,2,4) it will give answer 10 because it will override c=1 and give new value of argument 
           

        </script>

</body>
</html>
