<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximum</title>
</head>
<body>
      <script>
       
        let n=parseInt(prompt("Enter array size :"));

        let a=[];
        for(i=0;i<n;i++){

            j=parseInt(prompt("enter a no :"));
            a.push(j);
        }
         document.write("array = "+a+"<br/>");

        let max=a[0];
        for(i=0;i<a.length;i++){

            if(max<a[i]){

                max=a[i];
            }

        }
             document.write(max);



      </script>
</body>
</html>
