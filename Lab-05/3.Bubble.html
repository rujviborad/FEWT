<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
         <!-- // bubble short  -->

         <script>
             let n=parseInt(prompt("Enter array size :"));
                let a=[];
        for(i=0;i<n;i++){

            j=parseInt(prompt("enter a no :"));
            a.push(j);
        }
         document.write("Before array = "+a+"<br/>");

         for(i=0;i<n-1;i++){

            for(j=0;j<n-1-i;j++){

                     let temp;
                     if(a[j]>a[j+1]){

                        temp=a[j];
                        a[j]=a[j+1];
                        a[j+1]=temp;
                     }
            }
         }
         document.write("after array = "+a+"<br/>");

         </script>
</body>
</html>
