<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //   let a = [2,3,6,5,4];

      let n = parseInt(prompt("Enter array size :"));
      let a = [];
      for (i = 0; i < n; i++) {
        j = parseInt(prompt("enter a no :"));
        a.push(j);
      }
      document.write("Before array = " + a + "<br/>");
      function quicksort(a) {
        if (a.length <= 1) {
          return a;
        }
        let pivot = a[a.length - 1];
        let left = [];
        let right = [];

        for (i = 0; i < a.length - 1; i++) {
          if (a[i] < pivot) {
            left.push(a[i]);
          } else {
            right.push(a[i]);
          }
        }
        //   array merge with use of spread

        return [...quicksort(left), pivot, ...quicksort(right)];
      }
      let result = quicksort(a);

      document.write("shorted array=" + result + "<br/>");
    </script>
  </body>
</html>
