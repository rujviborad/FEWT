<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <script>
               let word="";
                let num=(prompt("Enter a number : "));

                if(isNaN(num)){

                     document.write("Not a Number ");

                }
                else{

                    num=parseInt(num);

                    if(num<0 || num>999){

                        document.write("Out Of Range ");
                    }

                    else{

                        let once=["zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];
                        let teens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
                        let hundrades=["","OneHundrad","TwoHundrad","ThreeHundrad","FourHundrad","FiveHundrad","SixHundrad","SevenHundrad","EightHundrad","NineHundrad"];

                    

                        if(num>99){

                         word+=hundrades[parseInt(num/100)];
                        num=num%100;

                        }
                        if(num>19){

                            word+=teens[parseInt(num/10)];
                            num=num%10;
                        }
                        if(num>0){

                            word+=once[parseInt(num)];

                    }
                }
                 document.write( word);
            }

       </script>
</body>
</html>
