<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      
    <script>

            let start =(parseInt(prompt("Enter a starting number :")));
             let end =(parseInt(prompt("Enter ending number :")));
            let n,i;

            for(let n=start; n<=end ; n++){

                 let count=0;
                 for(i=0;i<=n;i++){

                    if(n%i==0){

                        count++;
                    }
                 }

                 if(count==2){

                    document.write("prime numbers are = "+n +"<br/>");
                 }
            }
   </script>  
       
</body>
</html>
