<!DOCTYPE html>
<html>
<head>
<style>

a:link{
    color:orange;
}

a:visited{
    color:red;
}

p::first-line{
    color:blue;
    font-size:24px;
}

p::first-letter{
    color:red;
    font-size:40px;
    font-weight:bold;
}

::selection{
    background:yellow;
    color:black;
}

h1:hover{
    color:green;
    font-size:40px;
}

</style>
</head>

<body>

<a href="https://google.com">Google</a>

<p>
Welcome to Front End Web Technology. This paragraph demonstrates the
first-line, first-letter and selection pseudo-elements.
</p>

<h1>Move Mouse Here</h1>

</body>
</html>
