<!DOCTYPE html>
<html>
<head>
<style>

div{
    width:100px;
    height:100px;
    background:red;
    position:relative;

    animation-name:demo;
    animation-duration:6s;
    animation-delay:2s;
    animation-iteration-count:infinite;
    animation-direction:reverse;
    animation-timing-function:linear;
}

@keyframes demo{

0%{
    background:red;
    left:0;
    top:0;
}

25%{
    background:yellow;
    left:300px;
    top:0;
}

50%{
    background:green;
    left:300px;
    top:300px;
}

75%{
    background:blue;
    left:0;
    top:300px;
}

100%{
    background:red;
    left:0;
    top:0;
}

}

</style>
</head>

<body>

<div></div>

</body>
</html>
